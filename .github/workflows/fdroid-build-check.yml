name: F-Droid Build Verification (Upstream CI Simulation)

# NOTE: This workflow performs UPSTREAM CI VERIFICATION on a standard Linux runner.
# It is NOT an official F-Droid cleanroom build. Official F-Droid builds run in isolated
# Debian-based KVM builders via fdroidserver with external networking disabled during Gradle build.

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Git commit hash, branch, or tag to verify'
        required: true
        default: 'main'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/fdroid-build-check.yml'

jobs:
  verify-fdroid-build:
    name: Upstream F-Droid Build Simulation (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_commit || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform and Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Record Toolchain Environment
        run: |
          echo "=== Linux Host Environment ==="
          uname -a
          cat /etc/os-release
          echo "=== Java Environment ==="
          java -version
          echo "=== Gradle Wrapper ==="
          ./gradlew --version

      - name: Run Unit Tests (Standard Mode)
        run: ./gradlew testDebugUnitTest

      - name: Inject F-Droid Build Configuration
        run: |
          # Simulates F-Droid metadata prebuild step:
          # prebuild:
          #   - echo "disableUpdateChecker=true" >> ../gradle.properties
          echo "disableUpdateChecker=true" >> gradle.properties
          cat gradle.properties

      - name: Run Unit Tests (F-Droid Mode)
        run: ./gradlew testDebugUnitTest -PdisableUpdateChecker=true

      - name: Verify F-Droid BuildConfig Generation
        run: |
          ./gradlew generateReleaseBuildConfig
          BUILD_CONFIG=$(find app/build/generated/source/buildConfig/release -name "BuildConfig.*")
          echo "Found BuildConfig at: $BUILD_CONFIG"
          cat "$BUILD_CONFIG" | grep "ENABLE_UPDATE_CHECKER"
          if grep -q "ENABLE_UPDATE_CHECKER = false" "$BUILD_CONFIG"; then
            echo "SUCCESS: ENABLE_UPDATE_CHECKER is correctly set to false."
          else
            echo "ERROR: ENABLE_UPDATE_CHECKER was not disabled!"
            exit 1
          fi

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Record Artifact Checksums
        run: |
          echo "=== Generated Release Artifacts ==="
          ls -la app/build/outputs/apk/release/
          echo "=== Cryptographic Checksums (SHA-256) ==="
          sha256sum app/build/outputs/apk/release/*.apk
