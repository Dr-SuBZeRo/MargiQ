# Project-wide Gradle settings.
org.gradle.jvmargs=-Xms64m -Xmx768m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m -Dfile.encoding=UTF-8
