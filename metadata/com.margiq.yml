AutoName: MargiQ
Summary: Offline pharmaceutical price and profit margin calculator
Description: |-
  MargiQ is a focused, offline-first commercial pricing and profitability intelligence
  tool for pharmaceutical retailers, distributors, and stockists in India.

  Features:
  * Deterministic arbitrary-precision decimal calculations (PTR, PTS, GST, discounts).
  * On-device calculation history stored locally in SQLite with zero server requirements.
  * Versioned plaintext JSON export and import with canonical TLV deduplication.
  * Atomic database import transactions with automatic rollback protection.
  * Zero analytics, zero advertising networks, and zero telemetry SDKs.

